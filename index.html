<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="aos.css">
    
    <style>
        :root { 
            --blanco-hueso: #fdfdfd; 
            --negro-profundo: #050505; 
            --negro-suave: #0a0a0a;
            --gris-texto: #666;
            --glass: rgba(255, 255, 255, 0.03);
            --cursor-size: 15px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--negro-profundo); 
            font-family: 'Inter', sans-serif; 
            color: var(--blanco-hueso); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: none; /* Oculta el cursor real */
        }

        /* Textura de grano */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.12; pointer-events: none; z-index: 9999;
        }

        /* --- CURSOR PERSONALIZADO --- */
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: var(--cursor-size); height: var(--cursor-size);
            background-color: var(--blanco-hueso); border-radius: 50%; pointer-events: none;
            z-index: 10000; opacity: 0.7; transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, opacity 0.2s, background-color 0.2s;
        }

        /* --- NAVEGACIÓN --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 20px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            backdrop-filter: blur(10px);
        }
        .nav-container { display: flex; align-items: center; gap: 40px; }
        nav a { 
            color: var(--blanco-hueso); text-decoration: none; font-size: 0.65rem; 
            text-transform: uppercase; letter-spacing: 3px; font-weight: 300; transition: 0.4s; opacity: 0.6;
        }
        nav a:hover { opacity: 1; letter-spacing: 4px; }
        .nav-logo { height: 55px; width: auto; }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                              url('https://media.istockphoto.com/id/1144182437/es/vector/patr%C3%B3n-sin-costuras-con-cr%C3%A1neos-micr%C3%B3fonos-y-rosas.jpg?s=612x612&w=0&k=20&c=2NOfCOfG9YtPDnG0g6SW97ixHPLxkrwk0NADaTR_aMI=');
            background-size: 450px; background-attachment: fixed; text-align: center;
        }
        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 12vw, 8rem); 
            letter-spacing: 15px; text-transform: uppercase; font-weight: 600;
            background: linear-gradient(to bottom, #fff 40%, #555 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { letter-spacing: 10px; font-weight: 100; opacity: 0.5; font-size: 0.75rem; text-transform: uppercase; }

        /* --- FILOSOFÍA --- */
        .philosophy-section { padding: 150px 5%; background-color: var(--negro-suave); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .philosophy-section p { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.5rem, 4vw, 3rem); letter-spacing: 5px; font-weight: 300; line-height: 1.4; max-width: 900px; margin: 0 auto; color: #ccc; }
        .philosophy-section p strong { color: var(--blanco-hueso); font-weight: 600; }

        /* --- PORTAFOLIO SLIDER --- */
        .section-white { background-color: #f9f9f9; background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png'); padding: 100px 0; overflow: hidden; }
        .section-title-dark { text-align: center; color: #000; font-family: 'Cormorant Garamond', serif; font-size: 3rem; letter-spacing: 10px; margin-bottom: 60px; text-transform: uppercase; }
        .slider { display: flex; width: calc(350px * 12); animation: scroll 30s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-350px * 6)); } }
        .slide-item { width: 350px; height: 500px; padding: 0 15px; flex-shrink: 0; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.8s ease; }
        .slide-item:hover img { filter: grayscale(0%); transform: scale(1.03); }

        /* --- VIDEOS --- */
        .video-section { padding: 120px 5%; background: var(--negro-profundo); text-align: center; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1400px; margin: 60px auto 0; }
        .video-card { height: 600px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.05); }
        .video-card video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: 0.8s; }
        .video-card:hover video { filter: brightness(1); transform: scale(1.05); }

        /* --- ARTISTA --- */
        .artist-section { padding: 120px 5%; background: var(--negro-suave); text-align: center; }
        .artist-card { max-width: 500px; margin: 0 auto; padding: 70px 40px; background: var(--glass); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(15px); }
        .artist-photo { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; margin-bottom: 30px; filter: grayscale(1); border: 1px solid #333; }
        .artist-name { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; letter-spacing: 5px; text-transform: uppercase; }

        /* --- BOTONES --- */
        .cta-button { display: inline-block; width: 100%; max-width: 300px; padding: 20px; border: 1px solid #fff; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 4px; font-size: 0.7rem; transition: 0.4s; }
        .cta-button:hover { background: #fff; color: #000; }

        /* --- MAPA --- */
        .map-section { padding: 120px 5%; background: #000; text-align: center; }
        .map-container { max-width: 1100px; margin: 40px auto; height: 500px; border: 1px solid rgba(255,255,255,0.1); }
        .map-container iframe { width: 100%; height: 100%; border: 0; filter: grayscale(1) invert(0.9) contrast(1.2); }
        
        /* --- WHATSAPP FLOTANTE --- */
        .whatsapp-float {
            position: fixed; width: 60px; height: 60px; bottom: 40px; right: 40px;
            background-color: #25d366; color: #FFF; border-radius: 50px;
            display: flex; justify-content: center; align-items: center; font-size: 30px;
            z-index: 1000; text-decoration: none; transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); background-color: #1DA851; }

        footer { padding: 80px; text-align: center; color: #333; font-size: 0.6rem; letter-spacing: 5px; }

        @media (max-width: 768px) {
            .nav-container { gap: 20px; }
            .hero h1 { font-size: 4rem; }
            .video-grid { grid-template-columns: 1fr; }
            .whatsapp-float { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 25px; }
        }
    </style>
</head>
<body>

    <div class="custom-cursor"></div>

            <div class="slide-item"><img src="tattoo5.jpg" onerror="this.src='https://images.unsplash.com/photo-1560707303-4e980ce876ad?w=600'"></div>
            <div class="slide-item"><img src="tattoo6.jpg" onerror="this.src='https://images.unsplash.com/photo-1504198453319-5ce911bafcde?w=600'"></div>
            <div class="slide-item"><img src="tattoo1.jpg" onerror="this.src='https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?w=600'"></div>

            <div class="slide-item"><img src="tattoo6.jpg" onerror="this.src='https://images.unsplash.com/photo-1504198453319-5ce911bafcde?w=600'"></div>
        </div>
    </section>

    <section class="video-section">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; letter-spacing: 8px; text-transform: uppercase;" data-aos="fade-up">Procesos</h2>
        <div class="video-grid">
            <div class="video-card" data-aos="fade-up" data-aos-delay="100"><video src="video1.mp4" autoplay muted loop playsinline></video></div>

    <script src="aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 1000 });

        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, .slide-item, .video-card, .whatsapp-float').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '40px'; cursor.style.height = '40px'; 
                cursor.style.backgroundColor = 'rgba(255,255,255,0.2)'; cursor.style.opacity = '1';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.width = '15px'; cursor.style.height = '15px'; 
                cursor.style.backgroundColor = '#fdfdfd'; cursor.style.opacity = '0.7';
            });
        });
    </script>
</body>
</html>
