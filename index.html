<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --blanco-hueso: #fdfdfd; 
            --negro-profundo: #050505; 
            --gris-oscuro: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--negro-profundo); 
            font-family: 'Inter', sans-serif; 
            color: var(--blanco-hueso); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TEXTURA DE FONDO --- */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.12; pointer-events: none; z-index: 9999;
        }

        /* --- NAVEGACIÓN --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 25px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            backdrop-filter: blur(10px);
        }
        .nav-container { display: flex; align-items: center; gap: 50px; }
        nav a { 
            color: var(--blanco-hueso); text-decoration: none; font-size: 0.65rem; 
            text-transform: uppercase; letter-spacing: 4px; font-weight: 300; transition: 0.4s; 
            opacity: 0.6;
        }
        nav a:hover { opacity: 1; letter-spacing: 5px; }
        .nav-logo { height: 60px; width: auto; transition: 0.5s ease; }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                              url('https://media.istockphoto.com/id/1144182437/es/vector/patr%C3%B3n-sin-costuras-con-cr%C3%A1neos-micr%C3%B3fonos-y-rosas.jpg?s=612x612&w=0&k=20&c=2NOfCOfG9YtPDnG0g6SW97ixHPLxkrwk0NADaTR_aMI=');
            background-size: 500px; background-repeat: repeat; background-attachment: fixed; text-align: center;
        }
        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3.5rem, 15vw, 9rem); 
            letter-spacing: 20px; text-transform: uppercase; font-weight: 600;
            background: linear-gradient(to bottom, #fff 30%, #666 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { letter-spacing: 12px; font-weight: 100; opacity: 0.5; margin-top: -10px; text-transform: uppercase; font-size: 0.75rem; }

        /* --- PORTAFOLIO (CARRUSEL) --- */
        .section-white { 
            background-color: #f4f4f4; 
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: var(--negro-profundo); padding: 120px 0; overflow: hidden;
        }
        .section-title { 
            text-align: center; font-family: 'Cormorant Garamond', serif; 
            font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 300; margin-bottom: 60px; 
            letter-spacing: 12px; text-transform: uppercase;
        }
        .slider-container { 
            display: flex; gap: 25px; overflow-x: auto; padding: 20px 5% 60px; 
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .slide-item { 
            min-width: 320px; height: 480px; flex-shrink: 0; overflow: hidden; 
            box-shadow: 20px 20px 40px rgba(0,0,0,0.1); transition: 0.6s ease;
        }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 1s ease; }
        .slide-item:hover { transform: translateY(-15px) scale(1.02); }
        .slide-item:hover img { filter: grayscale(0%); }

        /* --- VIDEOS --- */
        .video-section { padding: 120px 5%; text-align: center; background: var(--negro-profundo); }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 50px; }
        .video-card { border: 1px solid rgba(255,255,255,0.05); overflow: hidden; height: 500px; }
        .video-card video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: 0.8s; }
        .video-card:hover video { filter: brightness(1); }

        /* --- ARTISTA --- */
        .artist-section { padding: 150px 5%; background-color: #080808; text-align: center; }
        .artist-card { 
            max-width: 500px; margin: 0 auto; padding: 80px 40px; 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(15px);
        }
        .artist-photo { 
            width: 180px; height: 180px; border-radius: 50%; object-fit: cover; 
            margin-bottom: 35px; filter: grayscale(100%); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px;
        }
        .artist-name { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; letter-spacing: 5px; text-transform: uppercase; }

        /* --- BOTONES --- */
        .btn-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px; }
        .cta-button { 
            display: inline-block; width: 100%; max-width: 300px; padding: 20px; 
            border: 1px solid var(--blanco-hueso); text-decoration: none; 
            color: var(--blanco-hueso); text-transform: uppercase; 
            letter-spacing: 4px; font-size: 0.7rem; transition: 0.4s; font-weight: 600;
        }
        .cta-button:hover { background: var(--blanco-hueso); color: var(--negro-profundo); }
        .insta-button { 
            text-decoration: none; color: #666; font-size: 0.7rem; letter-spacing: 4px; transition: 0.4s;
        }
        .insta-button:hover { color: #fff; }

        /* --- MAPA --- */
        .map-section { background: #000; padding: 120px 5%; text-align: center; }
        .map-container { 
            max-width: 1100px; margin: 40px auto; height: 500px; 
            border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
        }
        .map-container iframe { 
            width: 100%; height: 100%; border: 0; 
            filter: grayscale(1) invert(0.92) contrast(1.2); 
        }
        
        footer { padding: 80px 40px; text-align: center; background: #000; color: #222; letter-spacing: 5px; font-size: 0.6rem; }

        @media (max-width: 768px) {
            .nav-container { gap: 20px; }
            .nav-logo { height: 45px; }
            .slider-container { gap: 15px; }
            .slide-item { min-width: 280px; height: 400px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#fotos">Galería</a>
            <a href="#inicio"><img src="logo.png" alt="Inked Studio" class="nav-logo" onerror="this.style.display='none'"></a>
            <a href="#ubicacion">Estudio</a>
        </div>
    </nav>

    <section class="hero" id="inicio">
        <h1>INKED STUDIO</h1>
        <p>ARTE CON ALMA • EDOMÉX</p>
    </section>

    <section class="section-white" id="fotos">
        <h2 class="section-title">Portafolio</h2>
        <div class="slider-container" id="carrusel">
            <div class="slide-item"><img src="tattoo1.jpg" onerror="this.src='https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?w=600'"></div>
            <div class="slide-item"><img src="tattoo2.jpg" onerror="this.src='https://images.unsplash.com/photo-1590201841217-07446273e896?w=600'"></div>
            <div class="slide-item"><img src="tattoo3.jpg" onerror="this.src='https://images.unsplash.com/photo-1550537687-c91072c4792d?w=600'"></div>
            <div class="slide-item"><img src="tattoo4.jpg" onerror="this.src='https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?w=600'"></div>
            <div class="slide-item"><img src="tattoo5.jpg" onerror="this.src='https://images.unsplash.com/photo-1560707303-4e980ce876ad?w=600'"></div>
            <div class="slide-item"><img src="tattoo6.jpg" onerror="this.src='https://images.unsplash.com/photo-1504198453319-5ce911bafcde?w=600'"></div>
        </div>
    </section>

    <section class="video-section">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; letter-spacing: 8px; text-transform: uppercase;">Procesos</h2>
        <div class="video-grid">
            <div class="video-card"><video src="video1.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video2.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video3.mp4" autoplay muted loop playsinline></video></div>
        </div>
    </section>

    <section class="artist-section" id="artistas">
        <div class="artist-card">
            <img src="pato.jpg" alt="Pato" class="artist-photo" onerror="this.src='https://via.placeholder.com/300/111/fff?text=PATO'">
            <h3 class="artist-name">Pato</h3>
            <p style="letter-spacing: 5px; color: #666; text-transform: uppercase; font-size: 0.7rem;">Tattoo Artist Specialist</p>
            <div class="btn-container">
                <a href="https://wa.me/5215611828680" target="_blank" class="cta-button">Agendar Cita</a>
                <a href="https://www.instagram.com/inked_studi0/" target="_blank" class="insta-button">SIGUE NUESTRO ARTE EN INSTAGRAM</a>
            </div>
        </div>
    </section>

    <section class="map-section" id="ubicacion">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; letter-spacing: 8px; text-transform: uppercase;">Ubicación</h2>
        <p style="margin: 15px 0 40px; opacity: 0.4; font-weight: 300; letter-spacing: 2px; font-size: 0.8rem;">Jacarandas 11, Col. 3 de Mayo, Cuautitlán Izcalli, Méx.</p>
        
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3756.98034503798!2d-99.2066861!3d19.6601438!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d21f92adab4267%3A0xe838d74da9db4d88!2sJacarandas%2011%2C%203%20de%20Mayo%2C%2054710%20Cuautitl%C3%A1n%20Izcalli%2C%20M%C3%A9x.!5e0!3m2!1ses-419!2smx!4v1700000000000" 
                allowfullscreen="" loading="lazy">
            </iframe>
        </div>
        
        <a href="https://www.google.com/maps/dir//Jacarandas+11,+3+de+Mayo,+54710+Cuautitl%C3%A1n+Izcalli,+M%C3%A9x." 
           target="_blank" class="cta-button">
            Cómo llegar
        </a>
    </section>

    <footer>
        <p>INKED STUDIO • MMXXVI</p>
        <p style="margin-top: 10px; opacity: 0.2; font-size: 0.5rem;">CRAFTED FOR THE BOLD</p>
    </footer>

    <script>
        // Auto-scroll para el carrusel
        const slider = document.getElementById('carrusel');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => isDown = false);
        slider.addEventListener('mouseup', () => isDown = false);
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
        });
    </script>

</body>
</html>
