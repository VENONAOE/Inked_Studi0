<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --blanco-hueso: #fdfdfd;
            --negro-profundo: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--negro-profundo);
            font-family: 'Inter', sans-serif;
            color: var(--blanco-hueso);
            overflow-x: hidden;
        }

        /* --- NAVEGACIÓN --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        .nav-container { display: flex; align-items: center; gap: 40px; }

        nav a {
            color: var(--blanco-hueso); text-decoration: none;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px;
            font-weight: 300; transition: 0.4s;
        }

        .nav-logo { height: 60px; width: auto; transition: transform 0.3s; }

        /* --- HERO (FONDO PROFESIONAL) --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                              url('https://images.unsplash.com/photo-1598331668826-20cecc596b86?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 12vw, 8rem);
            letter-spacing: 15px; text-transform: uppercase; font-weight: 300;
        }

        /* --- PORTAFOLIO SLIDER --- */
        .section-white { background-color: var(--blanco-hueso); color: var(--negro-profundo); padding: 80px 0; }
        
        .section-title {
            text-align: center; font-family: 'Cormorant Garamond', serif;
            font-size: 3rem; font-weight: 300; margin-bottom: 40px;
        }

        .slider-container {
            display: flex; gap: 15px; overflow-x: auto; padding: 0 5%;
            scrollbar-width: none;
        }
        .slider-container::-webkit-scrollbar { display: none; }

        .slide-item { min-width: 320px; height: 450px; flex-shrink: 0; overflow: hidden; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.8s; }
        .slide-item:hover img { filter: grayscale(0%); }

        /* --- VIDEOS --- */
        .video-section { padding: 100px 5%; text-align: center; }
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; margin-top: 40px;
        }
        .video-card video { width: 100%; border-radius: 4px; filter: brightness(0.8); transition: 0.5s; }
        .video-card:hover video { filter: brightness(1); }

        /* --- UBICACIÓN (MAPA) --- */
        .map-section { background: var(--blanco-hueso); padding: 80px 5%; text-align: center; color: var(--negro-profundo); }
        .map-container {
            max-width: 1000px; margin: 30px auto; height: 450px;
            border-radius: 8px; overflow: hidden; border: 1px solid #ddd;
        }
        iframe { width: 100%; height: 100%; border: none; filter: grayscale(0.2); }

        /* --- CONTACTO --- */
        .contact-box { padding: 100px 5%; text-align: center; background: var(--blanco-hueso); }
        .cta-button {
            display: inline-block; padding: 18px 35px; margin: 10px;
            border: 1px solid var(--negro-profundo); text-decoration: none;
            color: var(--negro-profundo); text-transform: uppercase;
            letter-spacing: 2px; font-size: 0.7rem; font-weight: 600; transition: 0.4s;
        }
        .cta-button.black { background: var(--negro-profundo); color: var(--blanco-hueso); }

        footer { padding: 40px; text-align: center; font-size: 0.6rem; background: var(--blanco-hueso); color: #999; }

        @media (max-width: 768px) {
            .nav-container { gap: 15px; }
            .nav-logo { height: 45px; }
            .map-container { height: 300px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#fotos">Galería</a>
            <a href="#inicio">
                <img src="logo.png" alt="Inked Studio" class="nav-logo">
            </a>
            <a href="#ubicacion">Ubicación</a>
        </div>
    </nav>

    <section class="hero" id="inicio">
        <h1>INKED</h1>
        <p style="letter-spacing: 8px; font-weight: 100; opacity: 0.9;">ARTE CON ALMA • CIUDAD DE MÉXICO</p>
    </section>

    <section class="section-white" id="fotos">
        <h2 class="section-title">Portafolio</h2>
        <div class="slider-container">
            <div class="slide-item"><img src="tattoo1.jpg" alt="Tattoo 1"></div>
            <div class="slide-item"><img src="tattoo2.jpg" alt="Tattoo 2"></div>
            <div class="slide-item"><img src="tattoo3.jpg" alt="Tattoo 3"></div>
            <div class="slide-item"><img src="tattoo4.jpg" alt="Tattoo 4"></div>
            <div class="slide-item"><img src="tattoo5.jpg" alt="Tattoo 5"></div>
            <div class="slide-item"><img src="tattoo6.jpg" alt="Tattoo 6"></div>
        </div>
    </section>

    <section class="video-section" id="videos">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300;">En Movimiento</h2>
        <div class="video-grid">
            <div class="video-card"><video src="video1.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video2.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video3.mp4" autoplay muted loop playsinline></video></div>
        </div>
    </section>

    <section class="map-section" id="ubicacion">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300;">Donde sucede el arte</h2>
        <div class="map-container">
            <iframe 
                src="https://maps.app.goo.gl/8W2gPGm5Pz9QS9Be9" 
                allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

    <section class="contact-box" id="contacto">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; margin-bottom: 30px;">Agendar Cita</h2>
        <a href="https://wa.me/5215611828680?text=Hola,%20quiero%20agendar%20un%20tatto" target="_blank" class="cta-button">WhatsApp</a>
        <a href="https://www.instagram.com/inked_studi0/" target="_blank" class="cta-button black">Instagram</a>
    </section>

    <footer>INKED STUDIO • E D O M E X • 2026</footer>

</body>
</html>
