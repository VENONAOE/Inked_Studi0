<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --blanco-hueso: #fdfdfd; 
            --negro-profundo: #050505; 
            --gris-oscuro: #0a0a0a; 
            --border-style: 2px double rgba(255,255,255,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--negro-profundo); 
            font-family: 'Inter', sans-serif; 
            color: var(--blanco-hueso); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVEGACIÓN --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 20px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); 
        }
        .nav-container { display: flex; align-items: center; gap: 40px; }
        nav a { 
            color: var(--blanco-hueso); text-decoration: none; font-size: 0.65rem; 
            text-transform: uppercase; letter-spacing: 3px; font-weight: 300; transition: 0.4s; 
        }
        .nav-logo { height: 60px; width: auto; transition: transform 0.3s; }
        .nav-logo:hover { transform: scale(1.05); }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1598331668826-20cecc596b86?auto=format&fit=crop&q=80&w=2000');
            background-size: cover; background-position: center; background-attachment: fixed; text-align: center;
        }
        .hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 12vw, 8rem); letter-spacing: 15px; text-transform: uppercase; font-weight: 300; }
        .hero p { letter-spacing: 8px; font-weight: 100; opacity: 0.9; margin-top: 10px; }

        /* --- GALERÍA (FOTOS) --- */
        .section-white { background-color: var(--blanco-hueso); color: var(--negro-profundo); padding: 80px 0; }
        .section-title { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; margin-bottom: 40px; }
        .slider-container { display: flex; gap: 15px; overflow-x: auto; padding: 0 5%; scrollbar-width: none; }
        .slide-item { min-width: 320px; height: 450px; flex-shrink: 0; overflow: hidden; background: #eee; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.8s ease; }
        .slide-item:hover img { filter: grayscale(0%); }

        /* --- VIDEOS --- */
        .video-section { padding: 80px 5%; text-align: center; background: var(--negro-profundo); }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .video-card video { width: 100%; border-radius: 4px; filter: brightness(0.7); transition: 0.5s; cursor: pointer; }
        .video-card:hover video { filter: brightness(1); }

        /* --- SECCIÓN PATO & CONTACTO (CORREGIDA) --- */
        .artist-section { padding: 100px 5%; text-align: center; background-color: var(--gris-oscuro); border-top: 1px solid #111; }
        .artist-card { 
            max-width: 450px; margin: 0 auto; padding: 60px 30px; 
            border: 1px solid rgba(255,255,255,0.05); 
            background: #000; border-radius: 2px;
            backface-visibility: hidden; transform: translateZ(0); /* Estabilizador */
        }
        .artist-photo { 
            width: 150px; height: 150px; border-radius: 50%; object-fit: cover; 
            margin-bottom: 25px; filter: grayscale(100%); border: 1px solid rgba(255,255,255,0.2);
            padding: 5px; transition: 0.5s;
        }
        .artist-card:hover .artist-photo { filter: grayscale(0%); border-color: #fff; }
        .artist-name { font-family: 'Cormorant Garamond', serif; font-size: 3rem; letter-spacing: 5px; text-transform: uppercase; font-weight: 300; margin-bottom: 5px;}
        .artist-role { font-size: 0.65rem; letter-spacing: 5px; color: #666; text-transform: uppercase; margin-bottom: 40px; }

        /* --- BOTONES PREMIUM --- */
        .btn-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        .cta-button { 
            display: inline-block; width: 100%; max-width: 280px; padding: 18px; 
            border: 1px solid var(--blanco-hueso); text-decoration: none; 
            color: var(--blanco-hueso); text-transform: uppercase; 
            letter-spacing: 3px; font-size: 0.7rem; transition: 0.3s ease;
            backface-visibility: hidden;
        }
        .cta-button:hover { background: var(--blanco-hueso); color: var(--negro-profundo); }

        .insta-tattoo-button {
            display: inline-block; width: 100%; max-width: 280px; padding: 16px;
            background: transparent; color: #fff; text-decoration: none;
            font-size: 0.65rem; letter-spacing: 4px; font-weight: 600;
            border: 2px double rgba(255,255,255,0.4); 
            transition: all 0.3s ease-in-out;
            backface-visibility: hidden;
        }
        .insta-tattoo-button:hover {
            border-color: #fff; background: #fff; color: #000;
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        /* --- MAPA --- */
        .map-section { background: var(--blanco-hueso); padding: 80px 5%; text-align: center; color: var(--negro-profundo); }
        .map-container { max-width: 1000px; margin: 30px auto; height: 450px; border-radius: 4px; overflow: hidden; border: 1px solid #ddd; }
        iframe { width: 100%; height: 100%; border: none; }
        .map-btn { 
            display: inline-block; padding: 15px 30px; border: 1px solid var(--negro-profundo); 
            text-decoration: none; color: var(--negro-profundo); text-transform: uppercase; 
            letter-spacing: 2px; font-size: 0.7rem; font-weight: 600; transition: 0.4s;
        }
        .map-btn:hover { background: var(--negro-profundo); color: var(--blanco-hueso); }

        footer { padding: 60px 40px; text-align: center; font-size: 0.6rem; background: var(--blanco-hueso); color: #888; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .nav-container { gap: 15px; }
            .nav-logo { height: 45px; }
            .map-container { height: 350px; }
            .hero h1 { font-size: 3.5rem; letter-spacing: 8px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#fotos">Galería</a>
            <a href="#inicio"><img src="logo.png" alt="Inked Studio" class="nav-logo" onerror="this.style.display='none'"></a>
            <a href="#artistas">Pato</a>
            <a href="#ubicacion">Ubicación</a>
        </div>
    </nav>

    <section class="hero" id="inicio">
        <h1>INKED STUDIO</h1>
        <p>ARTE CON ALMA • EDOMÉX</p>
    </section>

    <section class="section-white" id="fotos">
        <h2 class="section-title">Portafolio</h2>
        <div class="slider-container">
            <div class="slide-item"><img src="tattoo1.jpg" alt="Work 1" onerror="this.src='https://via.placeholder.com/320x450/000?text=TRABAJO+1'"></div>
            <div class="slide-item"><img src="tattoo2.jpg" alt="Work 2" onerror="this.src='https://via.placeholder.com/320x450/000?text=TRABAJO+2'"></div>
            <div class="slide-item"><img src="tattoo3.jpg" alt="Work 3" onerror="this.src='https://via.placeholder.com/320x450/000?text=TRABAJO+3'"></div>
            <div class="slide-item"><img src="tattoo4.jpg" alt="Work 4" onerror="this.src='https://via.placeholder.com/320x450/000?text=TRABAJO+4'"></div>
            <div class="slide-item"><img src="tattoo5.jpg" alt="Work 5" onerror="this.src='https://via.placeholder.com/320x450/000?text=TRABAJO+5'"></div>
            <div class="slide-item"><img src="tattoo6.jpg" alt="Work 6" onerror="this.src='https://via.placeholder.com/320x450/000?text=TRABAJO+6'"></div>
        </div>
    </section>

    <section class="video-section">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; margin-bottom: 20px;">Procesos</h2>
        <div class="video-grid">
            <div class="video-card"><video src="video1.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video2.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video3.mp4" autoplay muted loop playsinline></video></div>
        </div>
    </section>

    <section class="artist-section" id="artistas">
        <div class="artist-card">
            <img src="pato.jpg" alt="Pato Artist" class="artist-photo" onerror="this.src='https://via.placeholder.com/150/222/FFF?text=PATO'">
            <h3 class="artist-name">Pato</h3>
            <p class="artist-role">Tattoo Artist Specialist</p>
            
            <div class="btn-container">
                <a href="https://wa.me/5215611828680?text=Hola,%20vi%20la%20página%20y%20quiero%20agendar%20con%20Pato" target="_blank" class="cta-button">
                    Agendar Cita
                </a>
                <a href="https://www.instagram.com/inked_studi0/" target="_blank" class="insta-tattoo-button">
                    INSTAGRAM PORTAFOLIO
                </a>
            </div>
        </div>
    </section>

    <section class="map-section" id="ubicacion">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem;">Visítanos</h2>
        <p style="margin-top: 10px; opacity: 0.7;">Jacarandas 11, 3 de Mayo, 54760 Cuautitlán Izcalli, Méx.</p>
        
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3756.980644322473!2d-99.19507982404172!3d19.66016168166928!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1f568973633bd%3A0x567f9824a114d5b8!2sJacarandas%2011%2C%203%20de%20Mayo%2C%2054760%20Cuautitl%C3%A1n%20Izcalli%2C%20M%C3%A9x.!5e0!3m2!1ses-419!2smx!4v1710000000000!5m2!1ses-419!2smx" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
        
        <a href="https://maps.app.goo.gl/o6Gv1fV6XNAn7UuK7" target="_blank" class="cta-button">
            Cómo llegar (Google Maps)
        </a>
    </section>

    <footer>
        <p>INKED STUDIO • 2026</p>
        <p style="margin-top: 10px; opacity: 0.5; font-size: 0.5rem;">DESIGNED FOR THE BOLD</p>
    </footer>

</body>
</html>
