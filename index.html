<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --blanco-hueso: #fdfdfd; 
            --negro-profundo: #050505; 
            --gris-oscuro: #0a0a0a;
            --acento: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--negro-profundo); 
            font-family: 'Inter', sans-serif; 
            color: var(--blanco-hueso); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- OVERLAY DE TEXTURA --- */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15; pointer-events: none; z-index: 9999;
        }

        /* --- NAVEGACIÓN --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 25px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            backdrop-filter: blur(10px);
        }
        .nav-container { display: flex; align-items: center; gap: 50px; }
        nav a { 
            color: var(--blanco-hueso); text-decoration: none; font-size: 0.65rem; 
            text-transform: uppercase; letter-spacing: 4px; font-weight: 300; transition: 0.4s; 
            opacity: 0.6;
        }
        nav a:hover { opacity: 1; letter-spacing: 5px; }
        .nav-logo { height: 65px; width: auto; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-logo:hover { transform: scale(1.1) rotate(5deg); }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                              url('https://media.istockphoto.com/id/1144182437/es/vector/patr%C3%B3n-sin-costuras-con-cr%C3%A1neos-micr%C3%B3fonos-y-rosas.jpg?s=612x612&w=0&k=20&c=2NOfCOfG9YtPDnG0g6SW97ixHPLxkrwk0NADaTR_aMI=');
            background-size: 500px; background-repeat: repeat; background-attachment: fixed; text-align: center;
        }
        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3.5rem, 15vw, 9rem); 
            letter-spacing: 25px; text-transform: uppercase; font-weight: 600;
            background: linear-gradient(to bottom, #fff 40%, #555 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }
        .hero p { letter-spacing: 15px; font-weight: 100; opacity: 0.5; margin-top: -10px; text-transform: uppercase; font-size: 0.7rem; }

        /* --- PORTAFOLIO (PAPEL VIEJO) --- */
        .section-white { 
            background-color: #f4f4f4; 
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: var(--negro-profundo); padding: 120px 0; 
        }
        .section-title { 
            text-align: center; font-family: 'Cormorant Garamond', serif; 
            font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 300; margin-bottom: 60px; 
            letter-spacing: 15px; text-transform: uppercase;
        }
        .slider-container { display: flex; gap: 25px; overflow-x: auto; padding: 20px 5%; scrollbar-width: none; }
        .slide-item { 
            min-width: 350px; height: 500px; flex-shrink: 0; overflow: hidden; 
            box-shadow: 25px 25px 50px rgba(0,0,0,0.15); transition: 0.6s ease;
        }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(0.9); transition: 1s ease; }
        .slide-item:hover { transform: translateY(-15px) scale(1.02); }
        .slide-item:hover img { filter: grayscale(0%) brightness(1); }

        /* --- VIDEOS --- */
        .video-section { padding: 120px 5%; text-align: center; background: var(--negro-profundo); }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 50px; }
        .video-card { border: 1px solid rgba(255,255,255,0.05); transition: 0.5s; overflow: hidden; }
        .video-card video { width: 100%; filter: brightness(0.4); transition: 0.8s; }
        .video-card:hover video { filter: brightness(1); transform: scale(1.05); }

        /* --- ARTISTA (GLASSMORPHISM) --- */
        .artist-section { padding: 150px 5%; background-color: #080808; border-top: 1px solid #111; }
        .artist-card { 
            max-width: 500px; margin: 0 auto; padding: 80px 40px; 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(15px); border-radius: 2px;
        }
        .artist-photo { 
            width: 180px; height: 180px; border-radius: 50%; object-fit: cover; 
            margin-bottom: 35px; filter: grayscale(100%); border: 1px solid rgba(255,255,255,0.3);
            padding: 10px; transition: 0.8s;
        }
        .artist-card:hover .artist-photo { filter: grayscale(0%); border-color: #fff; transform: rotate(5deg); }
        .artist-name { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 10px; }

        /* --- BOTONES --- */
        .btn-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .cta-button { 
            display: inline-block; width: 100%; max-width: 300px; padding: 22px; 
            border: 1px solid var(--blanco-hueso); text-decoration: none; 
            color: var(--blanco-hueso); text-transform: uppercase; 
            letter-spacing: 5px; font-size: 0.7rem; transition: 0.4s; font-weight: 600;
        }
        .cta-button:hover { background: var(--blanco-hueso); color: var(--negro-profundo); box-shadow: 0 0 30px rgba(255,255,255,0.2); }

        .insta-tattoo-button {
            display: inline-block; width: 100%; max-width: 300px; padding: 20px;
            background: transparent; color: #fff; text-decoration: none;
            font-size: 0.7rem; letter-spacing: 5px; font-weight: 600;
            border: 2px double rgba(255,255,255,0.4); transition: 0.4s;
        }
        .insta-tattoo-button:hover { border-color: #fff; background: #fff; color: #000; }

        /* --- UBICACIÓN --- */
        .map-section { background: #f4f4f4; padding: 120px 5%; text-align: center; color: var(--negro-profundo); }
        .map-container { max-width: 1100px; margin: 40px auto; height: 500px; border: 15px solid #fff; box-shadow: 0 40px 80px rgba(0,0,0,0.1); }
        
        footer { padding: 100px 40px; text-align: center; background: #000; color: #444; letter-spacing: 6px; font-size: 0.65rem; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 4rem; letter-spacing: 12px; }
            .nav-container { gap: 20px; }
            .slide-item { min-width: 280px; height: 400px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#fotos">Galería</a>
            <a href="#inicio"><img src="logo.png" alt="Inked Studio" class="nav-logo" onerror="this.style.display='none'"></a>
            <a href="#artistas">Pato</a>
            <a href="#ubicacion">Ubicación</a>
        </div>
    </nav>

    <section class="hero" id="inicio">
        <h1>INKED STUDIO</h1>
        <p>ARTE CON ALMA • EDOMÉX</p>
    </section>

    <section class="section-white" id="fotos">
        <h2 class="section-title">Portafolio</h2>
        <div class="slider-container">
            <div class="slide-item"><img src="tattoo1.jpg" alt="Work 1" onerror="this.src='https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&fit=crop&w=500&q=80'"></div>
            <div class="slide-item"><img src="tattoo2.jpg" alt="Work 2" onerror="this.src='https://images.unsplash.com/photo-1590201841217-07446273e896?auto=format&fit=crop&w=500&q=80'"></div>
            <div class="slide-item"><img src="tattoo3.jpg" alt="Work 3" onerror="this.src='https://images.unsplash.com/photo-1550537687-c91072c4792d?auto=format&fit=crop&w=500&q=80'"></div>
            <div class="slide-item"><img src="tattoo4.jpg" alt="Work 4" onerror="this.src='https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&fit=crop&w=500&q=80'"></div>
        </div>
    </section>

    <section class="video-section">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; letter-spacing: 10px; text-transform: uppercase;">Procesos</h2>
        <div class="video-grid">
            <div class="video-card"><video src="video1.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video2.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video3.mp4" autoplay muted loop playsinline></video></div>
        </div>
    </section>

    <section class="artist-section" id="artistas">
        <div class="artist-card">
            <img src="pato.jpg" alt="Pato Artist" class="artist-photo" onerror="this.src='https://via.placeholder.com/300/111/fff?text=PATO'">
            <h3 class="artist-name">Pato</h3>
            <p class="artist-role" style="letter-spacing: 6px; color: #888; font-size: 0.7rem; margin-bottom: 40px;">Especialista en Caligrafía y Blackwork</p>
            
            <div class="btn-container">
                <a href="https://wa.me/5215611828680?text=Hola,%20vi%20la%20página%20y%20quiero%20agendar%20con%20Pato" target="_blank" class="cta-button">
                    Agendar Cita
                </a>
                <a href="https://www.instagram.com/inked_studi0/" target="_blank" class="insta-tattoo-button">
                    VER INSTAGRAM
                </a>
            </div>
        </div>
    </section>

    <section class="map-section" id="ubicacion">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; letter-spacing: 10px; text-transform: uppercase;">Visítanos</h2>
        <p style="margin: 20px 0 40px; opacity: 0.6; font-weight: 300; letter-spacing: 2px;">Jacarandas 11, 3 de Mayo, Cuautitlán Izcalli, Méx.</p>
        
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3756.2345!2d-99.2156!3d19.6645!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTnCsDM5JzUyLjIiTiA5OcKwMTInNTYuMiJX!5e0!3m2!1ses!2smx!4v1700000000000" 
                allowfullscreen="" loading="lazy">
            </iframe>
        </div>
        
        <a href="https://maps.google.com" target="_blank" class="cta-button" style="color: black; border-color: black;">
            Abrir en Maps
        </a>
    </section>

    <footer>
        <p>INKED STUDIO • MMXXVI</p>
        <p style="margin-top: 15px; opacity: 0.3; font-size: 0.55rem; font-weight: 700;">FOR THE BOLD & THE SOULFUL</p>
    </footer>

</body>
</html>
