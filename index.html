<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --blanco-hueso: #fdfdfd;
            --negro-profundo: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--negro-profundo);
            font-family: 'Inter', sans-serif;
            color: var(--blanco-hueso);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- NAVEGACIÓN --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 30px;
            display: flex; justify-content: center; gap: 40px;
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        nav a {
            color: var(--blanco-hueso); text-decoration: none;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px;
            font-weight: 300; transition: 0.4s;
        }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-image: url('fondo.jpg'); background-size: cover;
            background-position: center; text-align: center;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 12vw, 8rem);
            letter-spacing: 15px; text-transform: uppercase; font-weight: 300;
        }

        /* --- BANDA DESLIZABLE (FOTOS) --- */
        .section-title {
            background-color: var(--blanco-hueso); color: var(--negro-profundo);
            padding-top: 80px; text-align: center; font-family: 'Cormorant Garamond', serif;
            font-size: 3rem; font-weight: 300;
        }

        .slider-container {
            background-color: var(--blanco-hueso);
            padding: 40px 0 80px 0;
            overflow-x: auto;
            display: flex;
            gap: 15px;
            padding-left: 5%;
            scrollbar-width: none; /* Oculta scroll en Firefox */
        }

        .slider-container::-webkit-scrollbar { display: none; } /* Oculta scroll en Chrome */

        .slide-item {
            min-width: 300px; height: 400px; flex-shrink: 0;
            background: #eee; overflow: hidden;
        }

        .slide-item img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%); transition: 0.8s;
        }

        .slide-item:hover img { filter: grayscale(0%); }

        /* --- SECCIÓN VIDEOS --- */
        .video-section {
            padding: 100px 5%; text-align: center;
            background-color: var(--negro-profundo);
        }

        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px; margin-top: 50px;
        }

        .video-card video {
            width: 100%; border: 1px solid rgba(255,255,255,0.1);
            filter: brightness(0.7); transition: 0.5s;
        }

        .video-card:hover video { filter: brightness(1); }

        /* --- BOTONES CONTACTO --- */
        .contact-box {
            padding: 100px 5%; text-align: center; background: var(--blanco-hueso);
        }

        .cta-button {
            display: inline-block; padding: 20px 40px; margin: 10px;
            border: 1px solid var(--negro-profundo); text-decoration: none;
            color: var(--negro-profundo); text-transform: uppercase;
            letter-spacing: 2px; font-size: 0.7rem; font-weight: 600; transition: 0.4s;
        }

        .cta-button.black { background: var(--negro-profundo); color: var(--blanco-hueso); }

        footer {
            padding: 50px; text-align: center; font-size: 0.6rem; 
            letter-spacing: 2px; background: var(--blanco-hueso); color: #888;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#fotos">Galería</a>
        <a href="#videos">Procesos</a>
        <a href="#contacto">Citas</a>
    </nav>

    <section class="hero">
        <h1>INKED</h1>
        <p style="letter-spacing: 10px; font-weight: 100;">ESTUDIO PRIVADO</p>
    </section>

    <div class="section-title" id="fotos">Colección de Arte</div>
    <div class="slider-container">
        <div class="slide-item"><img src="tattoo1.jpg" alt="Tattoo 1"></div>
        <div class="slide-item"><img src="tattoo2.jpg" alt="Tattoo 2"></div>
        <div class="slide-item"><img src="tattoo3.jpg" alt="Tattoo 3"></div>
        <div class="slide-item"><img src="tattoo4.jpg" alt="Tattoo 4"></div>
        <div class="slide-item"><img src="tattoo5.jpg" alt="Tattoo 5"></div>
        <div class="slide-item"><img src="tattoo6.jpg" alt="Tattoo 6"></div>
    </div>

    <section class="video-section" id="videos">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem; margin-bottom: 20px;">En Movimiento</h2>
        <div class="video-grid">
            <div class="video-card">
                <video src="video1.mp4" autoplay muted loop playsinline></video>
            </div>
            <div class="video-card">
                <video src="video2.mp4" autoplay muted loop playsinline></video>
            </div>
        </div>
    </section>

    <section class="contact-box" id="contacto">
        <a href="https://wa.me/5215611828680?text=Hola,%20quiero%20agendar%20un%20tatto%20por%20favor" target="_blank" class="cta-button">
            WhatsApp Citas
        </a>
        <a href="https://www.instagram.com/inked_studi0/" target="_blank" class="cta-button black">
            Instagram
        </a>
    </section>

    <footer>
        INKED STUDIO • CIUDAD DE MÉXICO • 2024
    </footer>

</body>
</html>
