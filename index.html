<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --blanco-hueso: #fdfdfd; 
            --negro-profundo: #050505; 
            --gris-oscuro: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--negro-profundo); 
            font-family: 'Inter', sans-serif; 
            color: var(--blanco-hueso); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- OVERLAY DE TEXTURA (GRANO) --- */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.12; pointer-events: none; z-index: 9999;
        }

        /* --- NAVEGACIÓN --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 25px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            backdrop-filter: blur(10px);
        }
        .nav-container { display: flex; align-items: center; gap: 50px; }
        nav a { 
            color: var(--blanco-hueso); text-decoration: none; font-size: 0.65rem; 
            text-transform: uppercase; letter-spacing: 4px; font-weight: 300; transition: 0.4s; 
            opacity: 0.6;
        }
        nav a:hover { opacity: 1; letter-spacing: 5px; }
        .nav-logo { height: 60px; width: auto; transition: 0.5s ease; }
        .nav-logo:hover { transform: scale(1.1); }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                              url('https://media.istockphoto.com/id/1144182437/es/vector/patr%C3%B3n-sin-costuras-con-cr%C3%A1neos-micr%C3%B3fonos-y-rosas.jpg?s=612x612&w=0&k=20&c=2NOfCOfG9YtPDnG0g6SW97ixHPLxkrwk0NADaTR_aMI=');
            background-size: 500px; background-repeat: repeat; background-attachment: fixed; text-align: center;
        }
        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3.5rem, 15vw, 9rem); 
            letter-spacing: 20px; text-transform: uppercase; font-weight: 600;
            background: linear-gradient(to bottom, #fff 30%, #666 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        }
        .hero p { letter-spacing: 12px; font-weight: 100; opacity: 0.5; margin-top: -10px; text-transform: uppercase; font-size: 0.75rem; }

        /* --- PORTAFOLIO --- */
        .section-white { 
            background-color: #f4f4f4; 
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: var(--negro-profundo); padding: 120px 0; 
        }
        .section-title { 
            text-align: center; font-family: 'Cormorant Garamond', serif; 
            font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 300; margin-bottom: 60px; 
            letter-spacing: 12px; text-transform: uppercase;
        }
        .slider-container { display: flex; gap: 20px; overflow-x: auto; padding: 20px 5%; scrollbar-width: none; }
        .slider-container::-webkit-scrollbar { display: none; }
        .slide-item { 
            min-width: 350px; height: 500px; flex-shrink: 0; overflow: hidden; 
            box-shadow: 20px 20px 40px rgba(0,0,0,0.1); transition: 0.6s ease;
        }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 1s ease; }
        .slide-item:hover { transform: translateY(-10px); }
        .slide-item:hover img { filter: grayscale(0%); }

        /* --- VIDEOS --- */
        .video-section { padding: 120px 5%; text-align: center; background: var(--negro-profundo); }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 50px; }
        .video-card { border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .video-card video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); transition: 0.8s; cursor: pointer; }
        .video-card:hover video { filter: brightness(1); transform: scale(1.03); }

        /* --- ARTISTA (GLASSMORPHISM) --- */
        .artist-section { padding: 150px 5%; background-color: #080808; text-align: center; }
        .artist-card { 
            max-width: 500px; margin: 0 auto; padding: 80px 40px; 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(15px); border-radius: 4px;
        }
        .artist-photo { 
            width: 180px; height: 180px; border-radius: 50%; object-fit: cover; 
            margin-bottom: 35px; filter: grayscale(100%); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px; transition: 0.8s;
        }
        .artist-card:hover .artist-photo { filter: grayscale(0%); border-color: #fff; transform: scale(1.05); }
        .artist-name { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 5px; }
        .artist-role { font-size: 0.7rem; letter-spacing: 5px; color: #666; text-transform: uppercase; margin-bottom: 40px; }

        /* --- BOTONES --- */
        .btn-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .cta-button { 
            display: inline-block; width: 100%; max-width: 300px; padding: 20px; 
            border: 1px solid var(--blanco-hueso); text-decoration: none; 
            color: var(--blanco-hueso); text-transform: uppercase; 
            letter-spacing: 4px; font-size: 0.7rem; transition: 0.4s; font-weight: 600;
        }
        .cta-button:hover { background: var(--blanco-hueso); color: var(--negro-profundo); box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        .insta-tattoo-button {
            display: inline-block; width: 100%; max-width: 300px; padding: 18px;
            background: transparent; color: #fff; text-decoration: none;
            font-size: 0.7rem; letter-spacing: 4px; font-weight: 600;
            border: 2px double rgba(255,255,255,0.3); transition: 0.4s;
        }
        .insta-tattoo-button:hover { border-color: #fff; background: #fff; color: #000; }

        /* --- SECCIÓN MAPA CORREGIDA --- */
        .map-section { background: #f4f4f4; padding: 120px 5%; text-align: center; color: var(--negro-profundo); }
        .map-container { 
            max-width: 1000px; 
            margin: 40px auto; 
            height: 500px; 
            border: 10px solid #fff; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); 
            position: relative;
            overflow: hidden;
            background: #eee;
        }
        .map-container iframe { 
            width: 100%; 
            height: 100%; 
            border: 0; 
            filter: grayscale(1) contrast(1.2) invert(0.9); /* Filtro pro: Blanco y Negro invertido para look luxury */
        }
        
        footer { padding: 80px 40px; text-align: center; background: #000; color: #333; letter-spacing: 5px; font-size: 0.6rem; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 3.5rem; letter-spacing: 10px; }
            .nav-container { gap: 15px; }
            .nav-logo { height: 45px; }
            .map-container { height: 350px; border: 5px solid #fff; }
            .slide-item { min-width: 280px; height: 400px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#fotos">Galería</a>
            <a href="#inicio"><img src="logo.png" alt="Inked Studio" class="nav-logo" onerror="this.style.display='none'"></a>
            <a href="#artistas">Pato</a>
            <a href="#ubicacion">Ubicación</a>
        </div>
    </nav>

    <section class="hero" id="inicio">
        <h1>INKED STUDIO</h1>
        <p>ARTE CON ALMA • EDOMÉX</p>
    </section>

    <section class="section-white" id="fotos">
        <h2 class="section-title">Portafolio</h2>
        <div class="slider-container">
            <div class="slide-item"><img src="tattoo1.jpg" alt="Work 1" onerror="this.src='https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&fit=crop&w=500&q=80'"></div>
            <div class="slide-item"><img src="tattoo2.jpg" alt="Work 2" onerror="this.src='https://images.unsplash.com/photo-1590201841217-07446273e896?auto=format&fit=crop&w=500&q=80'"></div>
            <div class="slide-item"><img src="tattoo3.jpg" alt="Work 3" onerror="this.src='https://images.unsplash.com/photo-1550537687-c91072c4792d?auto=format&fit=crop&w=500&q=80'"></div>
            <div class="slide-item"><img src="tattoo4.jpg" alt="Work 4" onerror="this.src='https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&fit=crop&w=500&q=80'"></div>
        </div>
    </section>

    <section class="video-section">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; letter-spacing: 8px; text-transform: uppercase;">Procesos</h2>
        <div class="video-grid">
            <div class="video-card"><video src="video1.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video2.mp4" autoplay muted loop playsinline></video></div>
            <div class="video-card"><video src="video3.mp4" autoplay muted loop playsinline></video></div>
        </div>
    </section>

    <section class="artist-section" id="artistas">
        <div class="artist-card">
            <img src="pato.jpg" alt="Pato Artist" class="artist-photo" onerror="this.src='https://via.placeholder.com/300/111/fff?text=PATO'">
            <h3 class="artist-name">Pato</h3>
            <p class="artist-role">Tattoo Artist Specialist</p>
            
            <div class="btn-container">
                <a href="https://wa.me/5215611828680?text=Hola,%20vi%20la%20página%20y%20quiero%20agendar%20con%20Pato" target="_blank" class="cta-button">
                    Agendar Cita
                </a>
                <a href="https://www.instagram.com/inked_studi0/" target="_blank" class="insta-tattoo-button">
                    INSTAGRAM
                </a>
            </div>
        </div>
    </section>

    <section class="map-section" id="ubicacion">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; letter-spacing: 8px; text-transform: uppercase;">Visítanos</h2>
        <p style="margin: 15px 0 40px; opacity: 0.6; font-weight: 300; letter-spacing: 2px; font-size: 0.9rem;">Jacarandas 11, 3 de Mayo, Cuautitlán Izcalli, Méx.</p>
        
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3756.4026365042894!2d-99.2084534!3d19.6954848!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d21f92e42f6f4d%3A0xc66596160910058b!2sJacarandas%2011%2C%203%20de%20Mayo%2C%2054760%20Cuautitl%C3%A1n%20Izcalli%2C%20M%C3%A9x.!5e0!3m2!1ses-419!2smx!4v1700000000000" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
        
        <a href="https://maps.app.goo.gl/kX7L1qHnFmP2" target="_blank" class="cta-button" style="color: black; border-color: black; margin-top: 20px;">
            Cómo llegar (Google Maps)
        </a>
    </section>

    <footer>
        <p>INKED STUDIO • MMXXVI</p>
        <p style="margin-top: 10px; opacity: 0.2; font-size: 0.5rem;">DESIGNED FOR THE BOLD</p>
    </footer>

</body>
</html>
