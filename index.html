<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inked Studio | Tinta y Caligrafía</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@100;300;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --blanco-hueso: #fdfdfd; 
            --negro-profundo: #050505; 
            --negro-suave: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--negro-profundo); 
            font-family: 'Inter', sans-serif; 
            color: var(--blanco-hueso); 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Capa de textura de grano sobre toda la web */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.12; pointer-events: none; z-index: 9999;
        }

        /* --- NAVEGACIÓN --- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 20px; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); 
            backdrop-filter: blur(10px);
        }
        .nav-container { display: flex; align-items: center; gap: 40px; }
        nav a { 
            color: var(--blanco-hueso); text-decoration: none; font-size: 0.65rem; 
            text-transform: uppercase; letter-spacing: 3px; font-weight: 300; transition: 0.4s; 
            opacity: 0.6;
        }
        nav a:hover { opacity: 1; letter-spacing: 4px; }
        .nav-logo { height: 55px; width: auto; }

        /* --- HERO --- */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), 
                              url('https://media.istockphoto.com/id/1144182437/es/vector/patr%C3%B3n-sin-costuras-con-cr%C3%A1neos-micr%C3%B3fonos-y-rosas.jpg?s=612x612&w=0&k=20&c=2NOfCOfG9YtPDnG0g6SW97ixHPLxkrwk0NADaTR_aMI=');
            background-size: 450px; background-attachment: fixed; text-align: center;
        }
        .hero h1 { 
            font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 12vw, 8rem); 
            letter-spacing: 15px; text-transform: uppercase; font-weight: 600;
            background: linear-gradient(to bottom, #fff 40%, #555 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { letter-spacing: 10px; font-weight: 100; opacity: 0.5; font-size: 0.75rem; text-transform: uppercase; }

        /* --- CARRUSEL INFINITO --- */
        .section-white { 
            background-color: #f9f9f9; 
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            padding: 100px 0; overflow: hidden;
            position: relative;
        }
        .section-title-dark { 
            text-align: center; color: #000; font-family: 'Cormorant Garamond', serif; 
            font-size: 3rem; letter-spacing: 10px; margin-bottom: 60px; text-transform: uppercase;
        }
        
        .slider {
            display: flex;
            width: calc(350px * 12); /* Doble del número de fotos para el loop */
            animation: scroll 30s linear infinite;
        }
        
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-350px * 6)); }
        }

        .slider:hover { animation-play-state: paused; }

        .slide-item { 
            width: 350px; height: 500px; padding: 0 15px; flex-shrink: 0; 
        }
        .slide-item img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(100%); transition: 0.8s ease;
            box-shadow: 15px 15px 40px rgba(0,0,0,0.1);
        }
        .slide-item:hover img { filter: grayscale(0%); transform: scale(1.03); }

        /* --- VIDEOS (TAMAÑO REEL) --- */
        .video-section { padding: 120px 5%; background: var(--negro-profundo); text-align: center; }
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); 
            gap: 30px; max-width: 1400px; margin: 60px auto 0;
        }
        .video-card { 
            height: 750px; overflow: hidden; background: #000;
            border: 1px solid rgba(255,255,255,0.05); position: relative;
        }
        .video-card video { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: brightness(0.6); transition: 0.8s; 
        }
        .video-card:hover video { filter: brightness(1); transform: scale(1.05); }

        /* --- ARTISTA --- */
        .artist-section { padding: 120px 5%; background: var(--negro-suave); text-align: center; }
        .artist-card { 
            max-width: 500px; margin: 0 auto; padding: 70px 40px; 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05); 
            backdrop-filter: blur(15px);
        }
        .artist-photo { 
            width: 160px; height: 160px; border-radius: 50%; object-fit: cover; 
            margin-bottom: 30px; filter: grayscale(1); border: 1px solid #333; padding: 5px;
        }
        .artist-name { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; letter-spacing: 5px; text-transform: uppercase; }

        /* --- BOTONES --- */
        .btn-container { margin-top: 40px; }
        .cta-button { 
            display: inline-block; width: 100%; max-width: 300px; padding: 20px; 
            border: 1px solid #fff; color: #fff; text-decoration: none; 
            text-transform: uppercase; letter-spacing: 4px; font-size: 0.7rem; transition: 0.4s;
        }
        .cta-button:hover { background: #fff; color: #000; }
        .insta-link { display: block; margin-top: 20px; color: #666; font-size: 0.6rem; letter-spacing: 3px; text-decoration: none; }
        .insta-link:hover { color: #fff; }

        /* --- MAPA --- */
        .map-section { padding: 120px 5%; background: #000; text-align: center; }
        .map-container { 
            max-width: 1100px; margin: 40px auto; height: 500px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .map-container iframe { 
            width: 100%; height: 100%; border: 0; 
            filter: grayscale(1) invert(0.9) contrast(1.2); 
        }
        
        footer { padding: 80px; text-align: center; color: #222; font-size: 0.6rem; letter-spacing: 5px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .video-card { height: 600px; }
            .video-grid { grid-template-columns: 1fr; }
            .slide-item { width: 300px; height: 420px; }
            @keyframes scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-300px * 6)); }
            }
        }
    </style>
</head>
